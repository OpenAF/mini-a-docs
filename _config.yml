title: mini-a
tagline: "Your goals. Your LLM. One command."
description: >-
  A minimalist autonomous agent framework built on OpenAF that uses LLMs,
  shell commands, and MCP servers to achieve user-defined goals.
baseurl: "/"
url: "https://mini-a.ai"

theme: minima

minima:
  skin: auto
  nav_pages:
    - getting-started.md
    - features.md
    - whats-new.md
    - agent-plugins.md
    - examples.md
    - configuration.md
    - search.md

external_nav:
  - title: Toolkit
    url: "https://tk.mini-a.ai/"

plugins:
  - jekyll-feed
  - jekyll-seo-tag

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: pretty

defaults:
  - scope:
      path: ""
    values:
      layout: "default"

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - PLAN.md
  - TODO.md
  - README.md

ga4_measurement_id: "G-X31CZ4BY7S"
