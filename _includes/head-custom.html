<!-- Custom head content for mini-a documentation -->

<!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">

<!-- Open Graph / Social Media Meta Tags -->
<meta property="og:type" content="website">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:title" content="{% if page.title %}{{ page.title }} - mini-a{% else %}mini-a - Minimalist Autonomous Agent{% endif %}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:image" content="{{ '/assets/images/mini-a-web-screenshot1.jpg' | absolute_url }}">

<!-- Twitter Card Meta Tags -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:url" content="{{ page.url | absolute_url }}">
<meta name="twitter:title" content="{% if page.title %}{{ page.title }} - mini-a{% else %}mini-a - Minimalist Autonomous Agent{% endif %}">
<meta name="twitter:description" content="{{ page.description | default: site.description }}">
<meta name="twitter:image" content="{{ '/assets/images/mini-a-web-screenshot1.jpg' | absolute_url }}">

<!-- Additional SEO -->
<meta name="keywords" content="mini-a, autonomous agent, LLM, AI, MCP, OpenAF, automation, chatbot, shell commands">
<meta name="author" content="OpenAF">
<link rel="canonical" href="{{ page.url | absolute_url }}">

<!-- Google Fonts for better typography (optional) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
